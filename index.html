<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#241610">
<title>Sushi Idle — Nhà hàng sushi chill</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Lilita+One&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="wrap">
  <canvas id="game"></canvas>

  <!-- HUD -->
  <div id="hud">
    <div class="bar coin-bar"><img src="assets/ui/coin.png" alt="coin"><span id="coinVal">0</span></div>
    <div class="bar gem-bar"><img src="assets/ui/gems.png" alt="gem"><span id="gemVal">0</span></div>
    <div id="floorBadge">Tầng 1</div>
    <div id="boostBadge" style="display:none">NẤU x2</div>
    <button id="btnMusic" class="icon-btn" aria-label="Nhạc"></button>
    <button id="btnSound" class="icon-btn" aria-label="Âm thanh"></button>
  </div>

  <!-- Bottom nav -->
  <nav id="bottomnav">
    <button data-screen="restaurant" class="active"><img src="assets/chef/cooking-00.png" alt=""><span>Nhà hàng</span></button>
    <button data-screen="map"><img src="assets/ui/map-icon.png" alt=""><span>Bản đồ</span></button>
    <button data-screen="shop"><img src="assets/ui/shop-icon.png" alt=""><span>Shop</span></button>
  </nav>

  <!-- Shop modal -->
  <div id="shopModal" class="hidden">
    <div class="modal-box">
      <div class="modal-head"><span>Cửa hàng</span><button id="btnCloseShop">✕</button></div>
      <div id="shopBody"></div>
    </div>
  </div>

  <!-- Popup xác nhận / chào mừng -->
  <div id="popup" class="hidden">
    <div class="modal-box small">
      <div class="modal-head"><span id="popupTitle"></span><button id="popupClose">✕</button></div>
      <div id="popupBody"></div>
      <button id="popupOk" class="buy big">Đồng ý</button>
    </div>
  </div>

  <div id="toast"></div>

  <div id="loading">
    <div class="load-title">SUSHI IDLE</div>
    <div id="loadText">Đang tải assets...</div>
    <div class="load-track"><div id="loadBar"></div></div>
  </div>
</div>

<script src="js/config.js"></script>
<script src="js/sim.js"></script>
<script src="js/assets.js"></script>
<script src="js/render.js"></script>
<script src="js/ui.js"></script>
<script src="js/input.js"></script>
<script src="js/main.js"></script>
</body>
</html>
