<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#2f9be8">
<title>Sushi Idle — Nhà hàng sushi chill</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Lilita+One&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="wrap">
  <canvas id="game"></canvas>

  <!-- HUD kiểu kit: badge khu vực + thanh gem/coin + bánh răng -->
  <div id="hud">
    <div id="areaBadge"><img src="assets/ui/hub-area-bar.png" alt=""><span>SUSHI TOWN</span></div>
    <div class="hbar" id="gemBar"><img class="hbar-bg" src="assets/ui/hud-coin-bar.png" alt=""><img class="hbar-ic" src="assets/ui/gems.png" alt=""><span id="gemVal">0</span></div>
    <div class="hbar" id="coinBar"><img class="hbar-bg" src="assets/ui/hud-coin-bar.png" alt=""><img class="hbar-ic" src="assets/ui/coin.png" alt=""><span id="coinVal">0</span></div>
    <button id="btnSettings" aria-label="Cài đặt"><img src="assets/ui/setting-icon.png" alt=""></button>
  </div>
  <div id="towerBoostBadge" style="display:none">BOOST x2</div>

  <!-- Bottom nav: BOOST | Bản đồ | Shop -->
  <nav id="bottomnav">
    <button id="navBoost"><img class="bbg" src="assets/ui/btn-boost.png" alt=""><img class="bic" src="assets/ui/boost-icon.png" alt=""><span class="btxt">BOOST</span><span class="cd" id="boostCd"></span></button>
    <button data-screen="map"><img src="assets/ui/map-icon.png" alt=""><span>Bản đồ</span></button>
    <button data-screen="shop"><img src="assets/ui/shop-icon.png" alt=""><span>Shop</span></button>
  </nav>
  <button id="mapBack" aria-label="Về tháp">‹</button>

  <!-- Popup khung mái ngói Nhật (dùng chung) -->
  <div id="popup" class="hidden">
    <div class="popup-frame">
      <div class="popup-roof">
        <span id="popupTitle"></span>
        <button id="popupClose" aria-label="Đóng"><img src="assets/ui/btn-close.png" alt=""></button>
      </div>
      <div class="popup-body" id="popupBody"></div>
    </div>
  </div>

  <!-- Shop modal (khung mái ngói, cuộn được) -->
  <div id="shopModal" class="hidden">
    <div class="popup-frame wide">
      <div class="popup-roof">
        <span>CỬA HÀNG</span>
        <button id="btnCloseShop" aria-label="Đóng"><img src="assets/ui/btn-close.png" alt=""></button>
      </div>
      <div class="popup-body scroll" id="shopBody"></div>
    </div>
  </div>

  <div id="toast"></div>

  <div id="loading">
    <div class="load-title">SUSHI IDLE</div>
    <div id="loadText">Đang tải assets...</div>
    <div class="load-track"><div id="loadBar"></div></div>
  </div>
</div>

<script src="js/config.js"></script>
<script src="js/sim.js"></script>
<script src="js/customers-data.js"></script>
<script src="js/dishes-data.js"></script>
<script src="js/assets.js"></script>
<script src="js/render.js"></script>
<script src="js/ui.js"></script>
<script src="js/input.js"></script>
<script src="js/main.js"></script>
</body>
</html>
